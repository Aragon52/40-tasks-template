<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="80%" cy="40%" r="70%" fx="75%" fy="35%">
      <stop offset="0%" stop-color="#431407" stop-opacity="0.3"/>
      <stop offset="25%" stop-color="#3b0764" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#1e1b4b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090a16" stop-opacity="1"/>
    </radialGradient>

    <!-- Linear Gradients for Wave Streams -->
    <linearGradient id="streamGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radial Glows for Neural Nodes -->
    <radialGradient id="nodeGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="1"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for Luminous Bloom -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.75" stroke-opacity="0.12"/>
      <circle cx="0" cy="0" r="1" fill="#818cf8" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="675" fill="#070814"/>
  <rect width="1200" height="675" fill="url(#bgGlow)"/>

  <!-- Perspective Perspective Grid Accent -->
  <rect x="0" y="0" width="1200" height="675" fill="url(#cyberGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="300" r="280" fill="url(#coreHalo)" filter="url(#softGlow)"/>
  <circle cx="350" cy="550" r="220" fill="url(#coreHalo)" opacity="0.6" filter="url(#softGlow)"/>

  <!-- Neural Network Energy Flow Waves -->
  <g opacity="0.85" filter="url(#bloom)">
    <!-- Primary Synaptic Wave -->
    <path d="M-100,520 C200,480 320,620 540,440 C760,260 880,480 1300,180" fill="none" stroke="url(#streamGrad1)" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Secondary Synaptic Wave -->
    <path d="M-50,380 C180,430 380,240 650,360 C900,480 1020,240 1300,320" fill="none" stroke="url(#streamGrad2)" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round"/>
    
    <!-- Tertiary Streamlines -->
    <path d="M0,600 C300,600 450,380 750,420 C1000,460 1100,280 1280,220" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.6"/>
    <path d="M100,200 C350,150 520,380 820,260 C1050,160 1150,220 1300,140" fill="none" stroke="#ec4899" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="4 8"/>
    <path d="M-80,450 C240,320 400,520 700,310 C960,120 1120,280 1300,260" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-opacity="0.7"/>
  </g>

  <!-- High-Tech Neural Hub / Agent Orb Graphic (Right Aligned) -->
  <g transform="translate(940, 310)">
    <!-- Outer Orbital Rings -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="16 12"/>
    <circle cx="0" cy="0" r="125" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="24 8 8 8"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="68" fill="url(#coreGlow)" opacity="0.85" filter="url(#bloom)"/>
    <circle cx="0" cy="0" r="32" fill="#ffffff" opacity="0.9" filter="url(#bloom)"/>

    <!-- Geometric Rotating Radar Markers -->
    <line x1="-180" y1="0" x2="-140" y2="0" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    <line x1="140" y1="0" x2="180" y2="0" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-180" x2="0" y2="-140" stroke="#a855f7" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="140" x2="0" y2="180" stroke="#a855f7" stroke-width="2" opacity="0.6"/>

    <!-- Orbital Satellite Nodes -->
    <circle cx="125" cy="-40" r="6" fill="#38bdf8" filter="url(#bloom)"/>
    <circle cx="-90" cy="85" r="5" fill="#f43f5e" filter="url(#bloom)"/>
    <circle cx="45" cy="115" r="7" fill="#a855f7" filter="url(#bloom)"/>
    <circle cx="-110" cy="-60" r="4" fill="#34d399" filter="url(#bloom)"/>
  </g>

  <!-- Constellation Nodes & Neural Interconnections -->
  <g filter="url(#bloom)">
    <!-- Connection Vectors -->
    <line x1="280" y1="360" x2="420" y2="290" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="420" y1="290" x2="560" y2="380" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="560" y1="380" x2="720" y2="280" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.7"/>
    <line x1="720" y1="280" x2="880" y2="330" stroke="#818cf8" stroke-width="2" stroke-opacity="0.8"/>
    
    <line x1="420" y1="290" x2="500" y2="180" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.5"/>
    <line x1="500" y1="180" x2="680" y2="210" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5"/>
    <line x1="680" y1="210" x2="720" y2="280" stroke="#e879f9" stroke-width="1.5" stroke-opacity="0.6"/>

    <line x1="340" y1="480" x2="560" y2="380" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="560" y1="380" x2="660" y2="490" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="660" y1="490" x2="840" y2="440" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="840" y1="440" x2="880" y2="330" stroke="#ec4899" stroke-width="1.8" stroke-opacity="0.7"/>

    <!-- Neural Glow Nodes -->
    <circle cx="280" cy="360" r="16" fill="url(#nodeGlowCyan)"/>
    <circle cx="280" cy="360" r="4.5" fill="#e0f2fe"/>

    <circle cx="420" cy="290" r="18" fill="url(#nodeGlowPurple)"/>
    <circle cx="420" cy="290" r="5" fill="#f5d0fe"/>

    <circle cx="500" cy="180" r="14" fill="url(#nodeGlowCyan)"/>
    <circle cx="500" cy="180" r="4" fill="#ffffff"/>

    <circle cx="680" cy="210" r="15" fill="url(#nodeGlowPurple)"/>
    <circle cx="680" cy="210" r="4.5" fill="#ffffff"/>

    <circle cx="560" cy="380" r="22" fill="url(#nodeGlowCyan)"/>
    <circle cx="560" cy="380" r="6" fill="#38bdf8"/>
    <circle cx="560" cy="380" r="2.5" fill="#ffffff"/>

    <circle cx="660" cy="490" r="16" fill="url(#nodeGlowPurple)"/>
    <circle cx="660" cy="490" r="4.5" fill="#ffffff"/>

    <circle cx="720" cy="280" r="24" fill="url(#nodeGlowPurple)"/>
    <circle cx="720" cy="280" r="6.5" fill="#e879f9"/>
    <circle cx="720" cy="280" r="3" fill="#ffffff"/>

    <circle cx="840" cy="440" r="18" fill="url(#nodeGlowCyan)"/>
    <circle cx="840" cy="440" r="5" fill="#bae6fd"/>

    <circle cx="880" cy="330" r="26" fill="url(#nodeGlowPurple)"/>
    <circle cx="880" cy="330" r="7" fill="#ffffff"/>

    <circle cx="340" cy="480" r="14" fill="url(#nodeGlowPurple)"/>
    <circle cx="340" cy="480" r="4" fill="#ffffff"/>
  </g>

  <!-- Digital Tech Accents (Hex Matrix & Code Marks) -->
  <g opacity="0.4" stroke="#818cf8" stroke-width="1" fill="none">
    <!-- Corner Framing -->
    <path d="M30,50 L30,30 L50,30"/>
    <path d="M1170,50 L1170,30 L1150,30"/>
    <path d="M30,625 L30,645 L50,645"/>
    <path d="M1170,625 L1170,645 L1150,645"/>

    <!-- High Tech Crosshair Markers -->
    <g transform="translate(140, 160)">
      <circle cx="0" cy="0" r="12" stroke-opacity="0.5"/>
      <line x1="-16" y1="0" x2="16" y2="0" stroke-opacity="0.7"/>
      <line x1="0" y1="-16" x2="0" y2="16" stroke-opacity="0.7"/>
    </g>
    <g transform="translate(240, 560)">
      <circle cx="0" cy="0" r="8" stroke-opacity="0.5"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke-opacity="0.7"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke-opacity="0.7"/>
    </g>
  </g>

  <!-- Ambient Shimmer Particles -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="210" cy="240" r="1.5" />
    <circle cx="310" cy="180" r="1" />
    <circle cx="460" cy="450" r="1.8" />
    <circle cx="590" cy="230" r="1.2" />
    <circle cx="630" cy="320" r="1.5" />
    <circle cx="780" cy="190" r="1" />
    <circle cx="810" cy="380" r="1.6" />
    <circle cx="920" cy="180" r="1.4" />
    <circle cx="990" cy="440" r="1.2" />
    <circle cx="1060" cy="260" r="1.8" />
    <circle cx="1120" cy="390" r="1.3" />
    <circle cx="160" cy="410" r="1" />
    <circle cx="730" cy="540" r="1.6" />
  </g>

  <!-- Subtle Vignette Edge Overlay -->
  <rect width="1200" height="675" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
</svg>
