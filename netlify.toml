[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Admin production subdomain rewrites
[[redirects]]
  from = "https://admin.walmark-retailshop.com/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "http://admin.walmark-retailshop.com/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "https://admin.walmark-retailshop.com/*"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "http://admin.walmark-retailshop.com/*"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "https://admin.walmark-retailshop.com"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "http://admin.walmark-retailshop.com"
  to = "/admin.html"
  status = 200
  force = true

# Direct static assets pass-through for all domains
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# Admin path rewrites
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
